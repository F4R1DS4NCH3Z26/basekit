name: ci

on:
  # Same triggers as basekit-go: a branch with an open PR runs once (pull_request), not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Includes acceptance 1-11; the compose tests (9) run because the runner has Docker.
      - run: npm test
      # dist/src is committed (git installs use it as is): it must match a fresh build of src/.
      - name: dist/src matches src/
        run: |
          git diff --exit-code -- dist/src
          test -z "$(git status --porcelain -- dist/src)" || { git status --short -- dist/src; echo "Run npm run compile and commit dist/src"; exit 1; }

  install:
    name: real install from GitHub (global and per project)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      # The repository is private: let git (used by npm for github: URLs) authenticate with the workflow token.
      - name: git credentials for this repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: npm install -g github:…
        run: |
          npm install -g --install-links --no-audit --no-fund "github:${{ github.repository }}#${{ github.sha }}"
          basekit stacks
          basekit init "$RUNNER_TEMP/global-app" -y --no-external-skills --stack nextjs
          test -f "$RUNNER_TEMP/global-app/AGENTS.md"
      - name: the installer through npx (what users run)
        run: |
          npm uninstall -g basekit
          npx -y "github:${{ github.repository }}#${{ github.sha }}" install --global --from "github:${{ github.repository }}#${{ github.sha }}"
          basekit stacks
      - name: npm install -D github:… in a project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir project && cd project && echo '{ "name": "app", "private": true }' > package.json
          npm install -D --no-audit --no-fund "github:${{ github.repository }}#${{ github.sha }}"
          npx --no-install basekit init . -y --no-external-skills --stack fastapi
          test -f AGENTS.md

  windows:
    name: Windows (PowerShell, core.autocrlf=true)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      # Git for Windows' usual default, and the private-repo credentials from the workflow token.
      - name: git config
        env:
          TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.autocrlf true
          git config --global url."https://x-access-token:$($env:TOKEN)@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:$($env:TOKEN)@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:$($env:TOKEN)@github.com/".insteadOf "git@github.com:"
      - name: the installer through npx, global
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npx -y "github:${{ github.repository }}#${{ github.sha }}" install --global --from "github:${{ github.repository }}#${{ github.sha }}"
          basekit --version
          basekit stacks
      - name: init, and no CRLF in what runs inside WSL/Docker
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $app = Join-Path $env:RUNNER_TEMP "win-app"
          basekit init $app -y --no-external-skills --stack nextjs
          foreach ($f in "AGENTS.md", ".gitattributes", "Makefile", ".claude/skills/zone-check/SKILL.md") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing $f" }
          }
          $crlf = Get-ChildItem -Path $app -Recurse -File -Force |
            Where-Object { $_.FullName -notmatch '\\.git\\' -and ($_.Name -like "*.sh" -or $_.Name -like "*.mk" -or $_.Name -in "Makefile", ".env.example", "Dockerfile") } |
            Where-Object { (Get-Content -Raw -LiteralPath $_.FullName) -match "`r" }
          if ($crlf) { $crlf | ForEach-Object { $_.FullName }; throw "CRLF line endings would break these files in WSL/Docker" }
          Push-Location $app
          npx --no-install basekit sync --no-external-skills
          Pop-Location
      - name: per project (npm install -D)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $p = Join-Path $env:RUNNER_TEMP "win-project"
          New-Item -ItemType Directory -Path $p | Out-Null
          Set-Content -Path (Join-Path $p "package.json") -Value '{ "name": "app", "private": true }'
          Push-Location $p
          npm install -D --no-audit --no-fund "github:${{ github.repository }}#${{ github.sha }}"
          npx --no-install basekit init . -y --no-external-skills --stack fastapi
          if (-not (Test-Path "AGENTS.md")) { throw "init did not run" }
          Pop-Location

  # install.sh and install.ps1 with fake node and npm: no network, no real global install.
  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # shellcheck comes preinstalled on the Ubuntu runner image.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/test-install.sh
      # sh is dash on Ubuntu and bash in POSIX mode on macOS.
      - name: install.sh with fake node and npm
        run: sh scripts/test-install.sh
      - name: install.sh under bash
        if: runner.os == 'Linux'
        run: INSTALL_SH=bash sh scripts/test-install.sh

  install-ps1:
    name: install.ps1 (Windows PowerShell 5.1 and PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install.ps1 with fake node and npm
        shell: pwsh
        run: ./scripts/test-install.ps1

  e2e:
    # Slow (every stack with Docker): not on pull requests, so a PR is quick to merge. It runs on every push to main
    # and by hand (workflow_dispatch), for example before tagging a release.
    if: github.event_name != 'pull_request'
    name: e2e ${{ matrix.env || 'dev' }} (${{ matrix.stack }}${{ matrix.db && format(' + {0}', matrix.db) || '' }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend and fullstack stacks (the list is plantillas/stacks/*/stack.json, by kind).
          - stack: django
          - stack: django-htmx
          - stack: express
          - stack: fastapi
          - stack: flask
          - stack: gin
          - stack: go-native
          - stack: laravel
          - stack: nestjs
          - stack: nextjs
          - stack: node-native
          - stack: php-native
          - stack: python-native
          # Spring's new-app adds data-jpa (SPRING_DB=postgresql by default): it needs a database to start.
          - stack: spring
            db: postgres
          - stack: symfony
          # MongoDB, only on the stacks whose stack.json lists mongo in dbs (dev; the CI tests enforce the list).
          - { stack: nestjs, db: mongo }
          # Frontend stacks have no database: no db axis (init rejects --db and --redis for them).
          - stack: react
          - stack: vanilla-ts
          - stack: vue
          # Production images: non-root users, cap_drop and the SQLite volume must work together.
          - { stack: django, db: sqlite, env: prod }
          - { stack: django-htmx, db: sqlite, env: prod }
          - { stack: express, db: sqlite, env: prod }
          - { stack: fastapi, db: sqlite, env: prod }
          - { stack: flask, db: sqlite, env: prod }
          - { stack: gin, db: sqlite, env: prod }
          - { stack: go-native, db: sqlite, env: prod }
          - { stack: laravel, db: sqlite, env: prod }
          - { stack: nestjs, db: sqlite, env: prod }
          - { stack: nextjs, db: sqlite, env: prod }
          - { stack: node-native, db: sqlite, env: prod }
          - { stack: php-native, db: sqlite, env: prod }
          - { stack: python-native, db: sqlite, env: prod }
          - { stack: spring, db: postgres, env: prod }
          - { stack: symfony, db: sqlite, env: prod }
          - { stack: react, env: prod }
          - { stack: vanilla-ts, env: prod }
          - { stack: vue, env: prod }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci && npm run compile
      # Acceptance 12: make new-app + make dev, answering on the stack healthcheck.
      # Arguments go through env and are added only when set: a frontend job (no db) passes no db argument at all,
      # never an empty one (scripts/e2e.sh rejects any argument that is not a db or --prod).
      - run: bash scripts/e2e.sh "$STACK" ${DB:+"$DB"} ${PROD:+--prod}
        env:
          STACK: ${{ matrix.stack }}
          DB: ${{ matrix.db }}
          PROD: ${{ matrix.env == 'prod' && '1' || '' }}
          # Composer's make new-app downloads package zips from api.github.com; anonymous requests from shared
          # runners get 504s. Only the PHP jobs (Laravel, Symfony, PHP nativo) receive the (read-only) workflow token.
          COMPOSER_AUTH: ${{ contains(fromJSON('["laravel","symfony","php-native"]'), matrix.stack) && format('{{"github-oauth":{{"github.com":"{0}"}}}}', secrets.GITHUB_TOKEN) || '' }}
